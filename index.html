<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presensi Digital</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    padding: 20px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    padding: 30px;
    max-width: 900px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  }
  h1 {
    text-align: center;
    color: #333;
    margin-bottom: 5px;
  }
  .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 25px;
    font-size: 14px;
  }
  .clock {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: #667eea;
    margin-bottom: 20px;
    font-variant-numeric: tabular-nums;
  }
  form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  form input, form select {
    padding: 12px;
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: border 0.3s;
  }
  form input:focus, form select:focus {
    outline: none;
    border-color: #667eea;
  }
  form button {
    grid-column: span 2;
    padding: 14px;
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s;
  }
  form button:hover { background: #5568d3; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: #f7f8fc;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
  }
  .stat-card .num {
    font-size: 22px;
    font-weight: bold;
    color: #667eea;
  }
  .stat-card .label {
    font-size: 12px;
    color: #666;
    margin-top: 4px;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .actions button {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
  }
  .btn-export { background: #28a745; color: #fff; }
  .btn-clear { background: #dc3545; color: #fff; }
  .btn-export:hover { background: #218838; }
  .btn-clear:hover { background: #c82333; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    padding: 10px;
    text-align: left;
    border-bottom: 1px solid #eee;
  }
  th {
    background: #667eea;
    color: #fff;
    font-weight: 600;
  }
  tr:hover { background: #f9f9f9; }
  .badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.Hadir { background: #d4edda; color: #155724; }
  .badge.Izin  { background: #fff3cd; color: #856404; }
  .badge.Sakit { background: #cce5ff; color: #004085; }
  .badge.Alfa  { background: #f8d7da; color: #721c24; }

  .empty {
    text-align: center;
    padding: 30px;
    color: #aaa;
  }
  @media (max-width: 600px) {
    form { grid-template-columns: 1fr; }
    form button { grid-column: span 1; }
    .stats { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="container">
  <h1>📋 Presensi Digital</h1>
  <p class="subtitle">Sistem Absensi Online Sederhana</p>
  <div class="clock" id="clock">--:--:--</div>

  <form id="presenceForm">
    <input type="text" id="nama" placeholder="Nama Lengkap" required>
    <input type="text" id="nis" placeholder="NIS / NIK / ID" required>
    <select id="status" required>
      <option value="">-- Pilih Keterangan --</option>
      <option value="Hadir">Hadir</option>
      <option value="Izin">Izin</option>
      <option value="Sakit">Sakit</option>
      <option value="Alfa">Alfa</option>
    </select>
    <input type="text" id="keterangan" placeholder="Catatan (opsional)">
    <button type="submit">✔ Simpan Presensi</button>
  </form>

  <div class="stats">
    <div class="stat-card"><div class="num" id="totalHadir">0</div><div class="label">Hadir</div></div>
    <div class="stat-card"><div class="num" id="totalIzin">0</div><div class="label">Izin</div></div>
    <div class="stat-card"><div class="num" id="totalSakit">0</div><div class="label">Sakit</div></div>
    <div class="stat-card"><div class="num" id="totalAlfa">0</div><div class="label">Alfa</div></div>
  </div>

  <div class="actions">
    <button class="btn-export" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="btn-clear" onclick="clearData()">🗑 Hapus Semua</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>No</th><th>Nama</th><th>ID</th><th>Status</th><th>Waktu</th><th>Catatan</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="6" class="empty">Belum ada data presensi</td></tr>
    </tbody>
  </table>
</div>

<script>
  const STORAGE_KEY = 'presensi_digital';
  let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  // Jam real-time
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = now.toLocaleTimeString('id-ID');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Render tabel
  function render() {
    const tbody = document.getElementById('tableBody');
    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">Belum ada data presensi</td></tr>';
    } else {
      tbody.innerHTML = data.map((item, i) => `
        <tr>
          <td>${i + 1}</td>
          <td>${item.nama}</td>
          <td>${item.nis}</td>
          <td><span class="badge ${item.status}">${item.status}</span></td>
          <td>${item.waktu}</td>
          <td>${item.keterangan || '-'}</td>
        </tr>
      `).join('');
    }
    updateStats();
  }

  // Update statistik
  function updateStats() {
    const count = s => data.filter(d => d.status === s).length;
    document.getElementById('totalHadir').textContent = count('Hadir');
    document.getElementById('totalIzin').textContent  = count('Izin');
    document.getElementById('totalSakit').textContent = count('Sakit');
    document.getElementById('totalAlfa').textContent  = count('Alfa');
  }

  // Submit form
  document.getElementById('presenceForm').addEventListener('submit', e => {
    e.preventDefault();
    const now = new Date();
    const waktu = now.toLocaleDateString('id-ID') + ' ' + now.toLocaleTimeString('id-ID');

    data.push({
      nama: document.getElementById('nama').value.trim(),
      nis: document.getElementById('nis').value.trim(),
      status: document.getElementById('status').value,
      keterangan: document.getElementById('keterangan').value.trim(),
      waktu
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    e.target.reset();
    render();
  });

  // Export CSV
  function exportCSV() {
    if (data.length === 0) return alert('Tidak ada data untuk diexport!');
    const header = 'No,Nama,ID,Status,Waktu,Catatan\n';
    const rows = data.map((d, i) =>
      `${i+1},"${d.nama}","${d.nis}","${d.status}","${d.waktu}","${d.keterangan}"`
    ).join('\n');
    const blob = new Blob([header + rows], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `presensi_${new Date().toISOString().slice(0,10)}.csv`;
    link.click();
  }

  // Clear data
  function clearData() {
    if (confirm('Yakin ingin menghapus semua data presensi?')) {
      data = [];
      localStorage.removeItem(STORAGE_KEY);
      render();
    }
  }

  render();
</script>
</body>
</html>
